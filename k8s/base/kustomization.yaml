apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sql
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
configMapGenerator:
  - name: gateway-config
    literals:
      - BACKEND=mock
      - MOCK_CPU_MS=20
      - WARMUP_SECONDS=3
      - MAX_INFLIGHT=16
      - REQUEST_TIMEOUT=30
