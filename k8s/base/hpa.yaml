apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}   # percent of the CPU *request*
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0        # react to load immediately
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}       # at most double every 15 s
        - {type: Pods, value: 4, periodSeconds: 15}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60       # do not flap: wait a minute of sustained low load
      policies:
        - {type: Pods, value: 1, periodSeconds: 30}
