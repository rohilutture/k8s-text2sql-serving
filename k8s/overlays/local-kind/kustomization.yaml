apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patches.yaml
  - target: {kind: Service, name: gateway}
    patch: |-
      - {op: add, path: /spec/type, value: NodePort}
      - {op: add, path: /spec/ports/0/nodePort, value: 30080}
configMapGenerator:
  - name: gateway-config
    behavior: merge
    literals:
      - BACKEND=mock
      - MOCK_CPU_MS=20
      - WARMUP_SECONDS=3
      - MAX_INFLIGHT=16
