apiVersion: v1
kind: Namespace
metadata:
  name: sql
  labels:
    # the vllm/vllm-openai image runs as root, which the 'restricted' Pod Security profile forbids; 'baseline' still
    # blocks privileged pods, host namespaces, hostPath, etc.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
